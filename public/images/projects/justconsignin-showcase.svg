<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">JustConsignIn featured project</title>
  <desc id="desc">Featured project card for JustConsignIn showing the consignment workflow from intake to paid.</desc>
  <rect width="920" height="560" rx="48" fill="#0B1F33"/>
  <rect x="42" y="42" width="836" height="476" rx="34" fill="#F7F9FC"/>
  <rect x="42" y="42" width="836" height="72" rx="34" fill="#E8EDF3"/>
  <rect x="42" y="82" width="836" height="32" fill="#E8EDF3"/>
  <circle cx="79" cy="78" r="9" fill="#B3BFCC"/>
  <circle cx="107" cy="78" r="9" fill="#B3BFCC"/>
  <circle cx="135" cy="78" r="9" fill="#B3BFCC"/>
  <rect x="88" y="154" width="184" height="42" rx="21" fill="#E8F0FF"/>
  <text x="180" y="181" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#2554C7">FEATURED PROJECT</text>
  <text x="88" y="248" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="900" fill="#0B1F33">
    <tspan x="88" dy="0">JustConsignIn — Shopify</tspan>
    <tspan x="88" dy="42">consignment management built</tspan>
    <tspan x="88" dy="42">from a real store problem.</tspan>
  </text>
  <text x="88" y="382" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" fill="#687889">
    <tspan x="88" dy="0">A working product connecting consignors, inventory, Shopify</tspan>
    <tspan x="88" dy="30">products, POS sales and payouts.</tspan>
  </text>
  <g font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle">
    <rect x="88" y="446" width="166" height="50" rx="14" fill="#EDF2F7"/><text x="171" y="478" fill="#40536A">Intake</text>
    <rect x="270" y="446" width="166" height="50" rx="14" fill="#EDF2F7"/><text x="353" y="478" fill="#40536A">Shopify</text>
    <rect x="452" y="446" width="166" height="50" rx="14" fill="#EDF2F7"/><text x="535" y="478" fill="#40536A">Sold</text>
    <rect x="634" y="446" width="166" height="50" rx="14" fill="#E8F0FF"/><text x="717" y="478" fill="#2554C7">Paid</text>
  </g>
</svg>